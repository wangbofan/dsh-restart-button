<svg xmlns="http://www.w3.org/2000/svg" width="720" height="190" viewBox="0 0 720 190" role="img" aria-label="DSH titlebar menu bar with a Restart button">
  <!-- Colors are DSH's own dark-theme tokens (--dsw-alias-*):
       bg-base #151517, label-secondary #cfd3d6, label-primary #f9fafb,
       interactive-bg-hover #ffffff14, bg-layer-2 #2c2c2e, border-l2 #ffffff1f, border-l3 #ffffff29. -->
  <rect x="0" y="0" width="720" height="190" rx="12" fill="#151517" stroke="#ffffff1f"/>

  <!-- window titlebar -->
  <rect x="12" y="12" width="696" height="46" rx="8" fill="#151517" stroke="#ffffff14"/>
  <text x="30" y="41" font-family="Segoe UI, sans-serif" font-size="13" fill="#61666b">DeepSeek Harness</text>

  <!-- menu bar buttons: the shell's own two, then the plugin's -->
  <g font-family="Segoe UI, sans-serif" font-size="14">
    <rect x="150" y="21" width="56" height="28" rx="6" fill="none"/>
    <text x="164" y="40" fill="#cfd3d6">应用</text>
    <rect x="212" y="21" width="56" height="28" rx="6" fill="none"/>
    <text x="226" y="40" fill="#cfd3d6">编辑</text>

    <!-- the plugin's button, drawn in its open state: background is
         --dsw-alias-interactive-bg-hover, text is --dsw-alias-label-primary -->
    <rect x="274" y="21" width="62" height="28" rx="6" fill="#ffffff14"/>
    <text x="288" y="40" fill="#f9fafb">重启</text>
    <path d="M344 35 h16" stroke="#979da6" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="368" y="40" fill="#979da6" font-size="12">← 本插件添加</text>
  </g>

  <!-- the native Application dropdown, built in the main process -->
  <g font-family="Segoe UI, sans-serif" font-size="13">
    <rect x="150" y="70" width="240" height="106" rx="8" fill="#2c2c2e" stroke="#ffffff29"/>
    <text x="166" y="93" fill="#f9fafb">关于 DeepSeek Harness</text>
    <line x1="158" y1="104" x2="382" y2="104" stroke="#ffffff1f"/>
    <text x="166" y="124" fill="#f9fafb">检查更新…</text>
    <text x="166" y="146" fill="#f9fafb">管理 dsh 命令…</text>
    <line x1="158" y1="157" x2="382" y2="157" stroke="#ffffff1f"/>
    <text x="166" y="172" fill="#f9fafb">退出</text>
  </g>
  <text x="404" y="126" font-family="Segoe UI, sans-serif" font-size="12" fill="#979da6">原生「应用」下拉在主进程里构建，</text>
  <text x="404" y="144" font-family="Segoe UI, sans-serif" font-size="12" fill="#979da6">插件无法插入菜单项 —— 所以按钮</text>
  <text x="404" y="162" font-family="Segoe UI, sans-serif" font-size="12" fill="#979da6">做在菜单栏上、紧邻「应用」。</text>
</svg>
